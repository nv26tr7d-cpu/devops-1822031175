name: Check and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Lay code ve
        uses: actions/checkout@v4

      - name: Kiem tra du 3 file
        run: |
          for f in index.html style.css script.js; do
            if [ ! -f "$f" ]; then
              echo "Thieu file: $f"
              exit 1
            fi
          done
          echo "Du 3 file"

      - name: Kiem tra the title
        run: |
          if ! grep -qi "<title>" index.html; then
            echo "index.html khong co the <title>"
            exit 1
          fi
          echo "Co the title"

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lay code ve
        uses: actions/checkout@v4

      - name: Cau hinh Pages
        uses: actions/configure-pages@v5

      - name: Dong goi website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy len GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4